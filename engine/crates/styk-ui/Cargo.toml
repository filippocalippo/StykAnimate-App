[package]
name = "styk-ui"
description = "The StykAnimate iced front end: draws what the core holds and turns input into core commands."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
iced = { workspace = true }
styk-design = { path = "../styk-design", features = ["widgets"] }

# winit has no display backend until one is enabled: without these, a Linux build stops at its compile_error. Both are
# on, so one binary runs under X11 and Wayland (the libraries are loaded at run time, not linked).
[target.'cfg(target_os = "linux")'.dependencies]
iced = { workspace = true, features = ["x11", "wayland", "wayland-dlopen", "wayland-decorations"] }
