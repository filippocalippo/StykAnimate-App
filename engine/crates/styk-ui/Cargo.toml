[package]
name = "styk-ui"
description = "The StykAnimate iced front end: draws what the core holds and turns input into core commands."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
iced = { workspace = true }
styk-core = { path = "../styk-core" }
styk-design = { path = "../styk-design", features = ["widgets"] }

[dev-dependencies]
png = "0.18"
styk-design = { path = "../styk-design", features = ["widgets", "testing"] }
