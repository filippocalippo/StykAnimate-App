[package]
name = "styk-ui"
description = "The StykAnimate iced front end: draws what the core holds and turns input into core commands."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "1.0", features = ["derive"] }
iced = { workspace = true }
styk-core = { path = "../styk-core" }
styk-design = { path = "../styk-design", features = ["widgets"] }
styk-services = { path = "../styk-services" }
