[package]
name = "styk-devtools"
description = "The StykAnimate developer tools. Compiled only with the app's devtools feature."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
iced = { workspace = true, optional = true }
png = { version = "0.18", optional = true }
styk-core = { path = "../styk-core" }
styk-design = { path = "../styk-design", features = ["widgets"], optional = true }
styk-platform = { path = "../styk-platform" }
styk-services = { path = "../styk-services" }
styk-trace = { path = "../styk-trace", features = ["enabled"] }
styk-ui = { path = "../styk-ui", optional = true }

serde_json = "1"

[features]
default = []
ui = ["dep:iced", "dep:png", "dep:styk-design", "dep:styk-ui"]
