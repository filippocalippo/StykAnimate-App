[package]
name = "styk-devtools"
description = "The StykAnimate developer tools. Compiled only with the app's devtools feature."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
styk-devtools-engine = { path = "../styk-devtools-engine" }
iced = { workspace = true, optional = true }
styk-core = { path = "../styk-core", features = ["inspect"] }
styk-design = { path = "../styk-design", features = ["widgets"], optional = true }
styk-trace = { path = "../styk-trace", features = ["enabled"] }
styk-ui = { path = "../styk-ui", optional = true }
serde_json = { version = "1", optional = true }


[features]
default = []
panels = ["styk-core/devtools"]
ui = ["panels", "dep:serde_json", "dep:iced", "dep:styk-design", "dep:styk-ui", "styk-ui/devtools"]
