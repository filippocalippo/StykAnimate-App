[package]
name = "styk-engine"
description = "The StykAnimate engine facade: the open document, background frame preparation and its cache."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
styk-alloc = { path = "../styk-alloc" }
styk-doc = { path = "../styk-doc" }
styk-formats = { path = "../styk-formats" }
styk-piv = { path = "../styk-piv" }
styk-eval = { path = "../styk-eval" }
styk-edit = { path = "../styk-edit" }
styk-draw = { path = "../styk-draw" }
miniz_oxide = { version = "0.9", default-features = false }

[dev-dependencies]
styk-core = { path = "../styk-core" }
styk-services = { path = "../styk-services" }
zstd = "0.13"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"

[features]
inspect = []
