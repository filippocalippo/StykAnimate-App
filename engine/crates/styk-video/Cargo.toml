[package]
name = "styk-video"
description = "Headless video export: the app's planning, frame source, flow and encoder services, driven from the command line."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "styk-video"
path = "src/main.rs"

[dependencies]
styk-core = { path = "../styk-core" }
styk-services = { path = "../styk-services" }
styk-platform = { path = "../styk-platform" }
styk-engine = { path = "../styk-engine" }
styk-export = { path = "../styk-export" }
styk-render = { path = "../styk-render" }
pollster = "0.4"
sha2 = "0.10"
