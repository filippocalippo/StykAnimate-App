[package]
name = "styk-design"
description = "The StykAnimate design system for the native app: tokens, icons, bundled fonts and shared widgets."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The iced side: conversions to iced types, the font handles and the icon widget, the focus and field widgets. Without it
# the crate is plain data (tokens, icon bytes, font bytes) that tools and tests read without a toolkit.
widgets = ["dep:iced", "dep:styk-core", "dep:cryoglyph"]
# The headless driver the widget tests (and the interface's) run on: a user interface with explicit clipboard and focus
# effects, drawn by the software renderer.
testing = ["widgets", "dep:iced_test", "iced/tiny-skia"]

[dependencies]
iced = { workspace = true, optional = true }
iced_test = { path = "../../../vendor/iced/test", optional = true }
styk-core = { path = "../styk-core", default-features = false, optional = true }
# The glyph worker's warm queue (vendored through the workspace patch, like iced's own).
cryoglyph = { git = "https://github.com/iced-rs/cryoglyph.git", rev = "cf38ed5ea0cfe95270b31ced2910560a7fcc5003", optional = true }

# The same Linux display backends as styk-app and styk-ui, so `-p styk-design --features widgets` builds there too.
[target.'cfg(target_os = "linux")'.dependencies]
iced = { workspace = true, optional = true, features = ["x11", "wayland", "wayland-dlopen", "wayland-decorations"] }

# The DirectWrite mask test draws a glyph the other way, through DirectWrite's own GDI bitmap render target.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi", "Win32_Foundation"] }

[dev-dependencies]
styk-platform = { path = "../styk-platform" }
