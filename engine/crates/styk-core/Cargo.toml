[package]
name = "styk-core"
description = "The StykAnimate application core: state, commands and view models in plain Rust, with no toolkit."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
styk-alloc = { path = "../styk-alloc", optional = true }
styk-doc = { path = "../styk-doc", optional = true }
styk-drawing = { path = "../styk-drawing", optional = true }
styk-edit = { path = "../styk-edit", optional = true }
styk-engine = { path = "../styk-engine", optional = true }
styk-eval = { path = "../styk-eval", optional = true }
styk-math = { path = "../styk-math", optional = true }
styk-services = { path = "../styk-services" }
styk-trace = { path = "../styk-trace", optional = true }
unicode-normalization = "=0.1.23"

[dev-dependencies]
styk-services = { path = "../styk-services", features = ["test-fakes"] }
sha2 = "0.10"
styk-formats = { path = "../styk-formats" }
zstd = "0.13"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[features]
default = ["engine"]
engine = ["dep:styk-alloc", "dep:styk-doc", "dep:styk-drawing", "dep:styk-edit", "dep:styk-engine", "dep:styk-eval", "dep:styk-math", "dep:styk-trace"]
inspect = ["engine", "styk-edit/inspect", "styk-engine/inspect", "styk-eval/inspect"]
