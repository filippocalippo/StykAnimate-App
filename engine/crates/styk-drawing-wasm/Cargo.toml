[package]
name = "styk-drawing-wasm"
description = "The drawing raster engine (styk-drawing) as the WebAssembly module the drawing workers and the brush model run."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
styk-doc = { path = "../styk-doc" }
styk-drawing = { path = "../styk-drawing" }
wasm-bindgen = "0.2"
js-sys = "0.3"
