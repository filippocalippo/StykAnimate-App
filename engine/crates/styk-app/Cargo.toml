[package]
name = "styk-app"
description = "The stykanimate program: command line, startup and the wiring of services, core and interface."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "stykanimate"
path = "src/main.rs"

[features]
# The developer build: the instrumentation layer records, and the tools are linked in. Same optimisation as release.
devtools = ["dep:styk-text-check", "dep:styk-devtools", "dep:iced_winit", "styk-trace/enabled"]

[dependencies]
styk-text-check = { path = "../styk-text-check", optional = true }
iced = { workspace = true }
iced_runtime = { path = "../../../vendor/iced/runtime" }
iced_wgpu = { path = "../../../vendor/iced/wgpu" }
iced_winit = { path = "../../../vendor/iced/winit", optional = true }
pollster = "0.4"
styk-core = { path = "../styk-core" }
styk-design = { path = "../styk-design", features = ["widgets"] }
styk-devtools = { path = "../styk-devtools", optional = true, features = ["ui"] }
styk-platform = { path = "../styk-platform" }
styk-services = { path = "../styk-services" }
styk-trace = { path = "../styk-trace" }
styk-ui = { path = "../styk-ui" }

# winit has no display backend until one is enabled: without these, a Linux build stops at its compile_error. Both are
# on, so one binary runs under X11 and Wayland (the libraries are loaded at run time, not linked).
[target.'cfg(target_os = "linux")'.dependencies]
iced = { workspace = true, features = ["x11", "wayland", "wayland-dlopen", "wayland-decorations"] }
