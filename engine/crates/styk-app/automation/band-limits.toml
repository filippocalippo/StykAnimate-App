# The top band's screenshot references and limits, beside the scripts until the screen catalogue's
# docs/native/screens/limits.toml exists (K-guards). Reproduce with the scripts in band-reference/ (see
# docs/native/shell-band.md): shots.mjs captures the references, make-script.mjs writes the native scripts,
# compare.mjs scores them.

[reference]
# Today's real rendering, captured as engine/crates/xtask/fonts-chromium.mjs does: headless bundled Chromium through
# Playwright, LCD text on (no --disable-lcd-text), opaque surfaces, today's stylesheets and fonts, device scale 1.
# The page is today's index.html header with today's measureBand, resolveTiers, installProjectTabs and hydrateIcons;
# the dock's Properties button is shown at widths up to 800 px as the dock does.
browser = "playwright chromium, args: --allow-file-access-from-files"
height = 900
scale = 1
tabs = ["Rooftop fight", "Chase (unsaved, in front)", "Untitled animation"]

[metric]
# PSNR over the band's rows (RGB), and the share of pixels whose largest channel differs by more than 24 levels.
# Each scenario also asserts, in the native window, the width and the fold steps Chromium applied.
name = "band-rows-psnr"

[limit]
# The floor of what was measured on 2026-11-08 (debug build); to be tightened, never loosened.
min_psnr_db = 20.0
max_differing_pixels_percent = 4.0

# Measured: psnr_db, differing_pixels_percent.
[[scenario]]
id = "rest-wide-light"
width = 1560
psnr_db = 29.0
differing = 1.88

[[scenario]]
id = "rest-wide-dark"
width = 1560
psnr_db = 26.1
differing = 1.59

[[scenario]]
id = "rest-icons-dark"
width = 720
psnr_db = 20.9
differing = 3.60

[[scenario]]
id = "movieclip-1000-light"
width = 1000
psnr_db = 23.7
differing = 3.82

[[scenario]]
id = "rest-narrowest-light"
width = 400
psnr_db = 26.9
differing = 3.71

# The other 17 scenarios (each fold step light at 903, 879, 851, 813, 789, 720, 610, 522, 490 px; narrowest dark;
# Build, camera and movieclip sessions; Build dark; one tab; twelve tabs) measured 22.4 to 30.6 dB and at most 3.78 %.
