[package]
name = "styk-edit"
description = "Editing commands on the StykAnimate document store, reproducing the JavaScript editor record for record (docs/engine/editing.md)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
# The integration tests are the binaries named below (tests/suite.rs holds all but those that need a process to themselves).
autotests = false

[dependencies]
styk-doc = { path = "../styk-doc" }
styk-eval = { path = "../styk-eval" }
styk-math = { path = "../styk-math" }
thiserror = "2"

[dev-dependencies]
styk-doc = { path = "../styk-doc", features = ["test-fakes"] }
sha2 = "0.10"

[features]
inspect = []

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "prepared_publication"
path = "tests/prepared_publication.rs"
