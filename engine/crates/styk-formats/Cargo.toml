[package]
name = "styk-formats"
description = "StykAnimate file formats: the .styk/.stkz/.stykmov containers, read into and written from the document store."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
styk-doc = { path = "../styk-doc" }
flate2 = "1"
zstd = { version = "0.13", features = ["experimental"] }
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"
