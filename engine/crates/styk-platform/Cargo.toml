[package]
name = "styk-platform"
description = "The operating-system implementations of the native app's services: Windows first, then macOS and Linux."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
raw-window-handle = "0.6"
styk-services = { path = "../styk-services" }

[target.'cfg(windows)'.dependencies]
# The updater: SHA-512 of the installer, Ed25519 over the feed, HTTPS with rustls (ring provider).
ring = "0.17"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tiny_http = "0.12"
