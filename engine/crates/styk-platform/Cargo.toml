[package]
name = "styk-platform"
description = "The operating-system implementations of the native app's services: Windows first, then macOS and Linux."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
raw-window-handle = "0.6"
styk-services = { path = "../styk-services" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Performance", "Win32_System_Threading"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
