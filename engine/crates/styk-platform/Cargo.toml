[package]
name = "styk-platform"
description = "The operating-system implementations of the native app's services: Windows first, then macOS and Linux."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
png = "0.18"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
styk-services = { path = "../styk-services" }
icu_collator = "=1.4.0"

[target.'cfg(windows)'.dependencies]
# The updater: SHA-512 of the installer, Ed25519 over the feed, HTTPS with rustls (ring provider).
ring = "0.17"
ureq = { version = "3", default-features = false, features = ["rustls"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_TabletPC",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_DirectWrite", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Performance", "Win32_System_Threading"] }

[dev-dependencies]
tiny_http = "0.12"

[features]
dev-control = []
