[package]
name = "styk-platform"
description = "The operating-system implementations of the native app's services: Windows first, then macOS and Linux."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
raw-window-handle = "0.6"
sha2 = "0.10"
styk-services = { path = "../styk-services" }
icu_collator = "=1.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# DirectWrite's rendering parameters (the contrast and gamma the person configured), which windows-sys has no COM for.
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_DirectWrite", "Win32_Foundation"] }
