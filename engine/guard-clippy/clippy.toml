# Receiver::into_iter and its Iterator::next have no reachable inherent function
# for Clippy's method list. Ban the Receiver type in interfaces instead (R2).
disallowed-types = [
 { path = "std::fs::File", reason = "N8: no file handles in interface code" },
 { path = "std::sync::mpsc::Receiver", reason = "N8: use asynchronous completion messages" },
]
