[package]
name = "styk-cli"
description = "Headless tools: decode, evaluate, benchmark and compare against the JavaScript reference."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "styk"
path = "src/main.rs"

[dependencies]
styk-core = { path = "../styk-core" }
serde_json = "1"
rayon = "1"
styk-render = { path = "../styk-render" }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
