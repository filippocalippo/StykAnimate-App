[workspace]
resolver = "3"
members = ["crates/styk-core", "crates/styk-render", "crates/styk-app", "crates/styk-cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

# Dependencies stay fast in debug builds so the viewer is usable while iterating.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
