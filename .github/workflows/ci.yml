name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  # A newer push replaces a pull request's run; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    # One shell everywhere: Git Bash on Windows runners, bash on Linux.
    shell: bash
env:
  NODE_VERSION: '24.11.0'
  PYTHON_VERSION: '3.12.9'
jobs:
  changes:
    # A pull request runs the checks its files can affect. Pushes to main and manual runs run all of them.
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.scope.outputs.engine }}
      app: ${{ steps.scope.outputs.app }}
      oracle: ${{ steps.scope.outputs.oracle }}
      unit-os: ${{ steps.scope.outputs.unit-os }}
    steps:
      - name: Decide which checks this change needs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          engine=true
          app=true
          oracle=true
          # The list holds at most 3000 files: a larger change, or a list that cannot be read, runs everything.
          if [ -n "$PR" ] && files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') \
            && [ "$(wc -l <<< "$files")" -lt 3000 ]; then
            # The Rust tests read the engine and the fixtures it shares with the unit tests.
            grep -qE '^(engine/|tests/fixtures/|\.github/(workflows|actions)/|(package\.json|rust-toolchain\.toml)$)' <<< "$files" || engine=false
            # Documentation alone cannot change the Windows, browser or packaged results.
            grep -qvE '(\.md$|^docs/|^LICENSE$|^\.github/(ISSUE_TEMPLATE/|CODEOWNERS$))' <<< "$files" || app=false
            # The Python codec is a development oracle the app does not run (backend/README.md): its own tests follow its files.
            grep -qE '^(backend/|codecs/|\.github/(workflows|actions)/)' <<< "$files" || oracle=false
          fi
          # The unit tests always run on Linux, and on Windows too unless only documentation changed.
          if [ "$app" = true ]; then unit_os='["ubuntu-24.04","windows-latest"]'; else unit_os='["ubuntu-24.04"]'; fi
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "oracle=$oracle" >> "$GITHUB_OUTPUT"
          echo "unit-os=$unit_os" >> "$GITHUB_OUTPUT"
          echo "Rust tests: $engine. Windows, browser and packaged checks: $app. Python oracle tests: $oracle." >> "$GITHUB_STEP_SUMMARY"

  engine-wasm:
    # The engine's WebAssembly modules, built once for every job below. Unchanged engine sources reuse the build
    # of an earlier run, so a change outside the engine does not wait for the compiler.
    name: Engine build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Reuse the build of these engine sources
        id: pkg
        uses: actions/cache@v6
        with:
          path: src/engine/pkg
          # Everything under engine/ except tests, fixtures and notes, with the scripts that build and check the modules.
          key: engine-pkg-${{ hashFiles('engine/**', '!engine/target/**', '!engine/tests/**', '!engine/crates/*/tests/**', '!engine/**/*.md', '!engine/*.tsv', 'rust-toolchain.toml', 'scripts/engine-build.mjs', 'scripts/engine-verify-pkg.mjs', '.github/actions/engine-build/action.yml') }}
      - name: Build the engine
        if: steps.pkg.outputs.cache-hit != 'true'
        uses: ./.github/actions/engine-build
      - name: Require the engine build output
        run: node scripts/engine-verify-pkg.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: engine-pkg
          path: src/engine/pkg
          retention-days: 3
          if-no-files-found: error

  checks:
    # What needs no engine build: syntax, lint, stylesheets, locales, the engine inventory and the changelog.
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax, lint and changelog
        run: |
          npm run check
          npm run lint
          npm run changelog:check

  unit:
    # Windows matches the release runner and exercises the Windows-only services;
    # Linux is a supported platform and must stay green on every change.
    # Two jobs per platform, about equal in time: the suites that replay documents through the engine, and the rest.
    name: Unit tests (${{ matrix.os }}, ${{ matrix.part }})
    needs: [changes, engine-wasm]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.unit-os) }}
        part: [engine, rest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Unit tests need neither the Electron binary nor Playwright browsers.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # Unit tests open documents through the engine and Pivot files through the codec module (src/engine/pkg).
      - name: Engine build
        uses: actions/download-artifact@v8
        with:
          name: engine-pkg
          path: src/engine/pkg
      # Tests that need the local Pivot corpus, generated inventories or built
      # encoders skip here and name the missing fixture; they run locally.
      - name: Application unit tests
        run: |
          # `npm test` with the files of one part. The first line fails when that script changes without this step.
          grep -qF '"test": "node --import ./tests/support/register-engine.mjs --test tests/*.test.mjs"' package.json
          shopt -s extglob
          if [ "$PART" = engine ]; then files=(tests/engine-*.test.mjs); else files=(tests/!(engine-*).test.mjs); fi
          echo "${#files[@]} test files"
          node --import ./tests/support/register-engine.mjs --test "${files[@]}"

  oracle:
    # The Python codec is a development oracle the app does not run (backend/README.md): its tests follow its files.
    name: Codec oracle tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Codec oracle tests
        run: python -m unittest discover -s backend -p "test_*.py"

  engine:
    # The Rust engine's own tests, when the engine or the fixtures it reads changed.
    name: Engine tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Without debug information: with it the test binaries of the workspace fill the Linux runner's disk and slow the Windows link.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      # The runners have no GPU: the tests that need one say so and pass (engine/crates/styk-render/tests/support/gpu.rs).
      STYK_ALLOW_NO_GPU: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (the pinned stable, rust-toolchain.toml)
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustc --version
      # Compiled dependencies only: the workspace's own crates are rebuilt from the checkout. Pull requests read the
      # cache main wrote, so their builds do not push each other out of the repository's cache space.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Engine tests
        run: cargo test --manifest-path engine/Cargo.toml --workspace --exclude styk-wasm --no-fail-fast

  web:
    needs: [changes, engine-wasm]
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/web-verify.yml
    with:
      engine-artifact: engine-pkg

  linux-app:
    # Builds the Linux app from source exactly as a release would, then boots it.
    name: Linux app
    needs: [changes, engine-wasm]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The runner has no GPU. The app's Linux WebGPU opt-in would land on a software device whose pictures cannot be
      # read back, so the packaged app runs on its WebGL 2 path here (desktop/gpu-switches.cjs).
      STYK_GPU_UNSAFE: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r scripts/requirements-build.txt
          # The runner image ships xvfb; the package index is only read where it does not.
          command -v xvfb-run > /dev/null || { sudo apt-get update; sudo apt-get install -y xvfb; }
          # Ubuntu 24.04 runners restrict unprivileged user namespaces, which
          # Chromium's sandbox needs; the app itself never disables the sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Stage the video encoder
        run: npm run build:video-encoder
      - name: Engine build
        uses: actions/download-artifact@v8
        with:
          name: engine-pkg
          path: src/engine/pkg
      - name: Package the AppImage
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist:linux -- --x64 --publish never
          npm run verify:package
      - name: Boot the packaged app
        run: |
          xvfb-run -a npm run test:boot:packaged
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          STYK_PACKAGED_EXECUTABLE="$GITHUB_WORKSPACE/release/StykAnimate-$version-linux-x86_64.AppImage" xvfb-run -a npm run test:boot:packaged
      - name: Export video with the bundled encoder
        run: xvfb-run -a npm run test:export:packaged
      - name: Verify Linux updates and save before restart
        run: |
          STYK_PACKAGED_EXECUTABLE="$GITHUB_WORKSPACE/release/linux-unpacked/stykanimate" xvfb-run -a npm run test:updates:desktop
          xvfb-run -a npm run test:updates:linux
      - name: Upload the build evidence
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            release/*.AppImage
            release/latest-linux.yml
            artifacts/updates/smoke.json
            artifacts/updates/appimage-smoke.json
          retention-days: 7

  result:
    # One check to require in branch protection: green when every job above passed or was skipped as not needed.
    name: Tests passed
    if: always()
    needs: [changes, engine-wasm, checks, unit, oracle, engine, web, linux-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
